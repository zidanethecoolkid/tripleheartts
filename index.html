<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPLE HEARTS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    /* Fill the screen on wide/landscape displays (same as before) */
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  /* On portrait / narrow screens (phones), show the WHOLE frame so the
     baked-in text is never cropped. Black letterbox bars blend with the bg. */
  @media (max-aspect-ratio: 1/1) {
    #bg { object-fit: contain; }
  }
</style>
</head>
<body>
  <video id="bg" autoplay muted loop playsinline webkit-playsinline preload="auto">
    <source src="soldout.mp4" type="video/mp4">
  </video>
  <script>
    // Keep the background video playing (some browsers pause muted autoplay until interaction)
    var v = document.getElementById('bg');
    function play(){ if (v) v.play().catch(function(){}); }
    play();
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) play(); });
    document.addEventListener('click', play, { once: true });
    document.addEventListener('touchstart', play, { once: true });
  </script>
</body>
</html>
