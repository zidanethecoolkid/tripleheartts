<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPLE HEARTS</title>
<style>
  @font-face {
    font-family: 'Trattatello';
    src: url('trattatello.woff2') format('woff2');
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  .overlay {
    position: fixed; inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .soldout {
    font-family: 'Trattatello', 'Apple Chancery', cursive;
    /* ~128pt on desktop, scales down on smaller screens so it never overflows */
    font-size: min(128pt, 15vw);
    line-height: 1;
    color: #000;
    -webkit-text-stroke: 2px #fff;
    text-stroke: 2px #fff;
    paint-order: stroke fill;
    white-space: nowrap;
    -webkit-user-select: none; user-select: none;
  }
</style>
</head>
<body>
  <video id="bg" autoplay muted loop playsinline webkit-playsinline preload="auto">
    <source src="soldout.mp4" type="video/mp4">
  </video>
  <div class="overlay">
    <div class="soldout">sold out.</div>
  </div>
  <script>
    // Keep the background video playing (some browsers pause muted autoplay until interaction)
    var v = document.getElementById('bg');
    function play(){ if (v) v.play().catch(function(){}); }
    play();
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) play(); });
    document.addEventListener('click', play, { once: true });
    document.addEventListener('touchstart', play, { once: true });
  </script>
</body>
</html>
